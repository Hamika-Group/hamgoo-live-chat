name: Package stable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to publish or retry (example: v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Validate stable tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Use an existing stable tag in vX.Y.Z format."
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Check version metadata and freeze revision
        id: commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/package.py --tag "$RELEASE_TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    needs: revision
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.revision.outputs.commit }}
    permissions:
      contents: read

  release:
    needs: [revision, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.revision.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.revision.outputs.commit }}
          fetch-depth: 0
      - name: Build installable ZIP and portable checksum
        run: |
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          python3 scripts/package.py --tag "$RELEASE_TAG" --checksum
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Keep downloadable build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hamgoo-live-chat-${{ needs.revision.outputs.tag }}
          path: |
            dist/hamgoo-live-chat-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Create release or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP="dist/hamgoo-live-chat-${RELEASE_TAG#v}.zip"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP" dist/SHA256SUMS --clobber
          else
            NOTES="docs/release-notes/${RELEASE_TAG#v}.md"
            if test -f "$NOTES"; then
              gh release create "$RELEASE_TAG" "$ZIP" dist/SHA256SUMS \
                --verify-tag --title "Hamgoo Live Chat $RELEASE_TAG" --notes-file "$NOTES"
            else
              gh release create "$RELEASE_TAG" "$ZIP" dist/SHA256SUMS \
                --verify-tag --title "Hamgoo Live Chat $RELEASE_TAG" --generate-notes
            fi
          fi
