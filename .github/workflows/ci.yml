name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Exact revision to check; defaults to the triggering revision'
        type: string
        default: ''
      wordpress_org:
        description: 'Require every WordPress.org listing check'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      wordpress_org:
        description: 'Require every WordPress.org listing check'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP and WordPress coding standards
        run: |
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l hamgoo-live-chat.php
          php -l uninstall.php
          composer lint
      - name: Targeted rule and loader checks
        run: |
          php tests/run.php
          node --check assets/js/admin.js
          node --check assets/js/loader.js
          node tests/loader.test.js
      - name: Catalogs and installable ZIP
        run: |
          python3 scripts/translations.py
          git diff --exit-code -- languages
          python3 scripts/verify.py
          python3 tests/package.test.py

  plugin-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hamgoo-ci-only
          MYSQL_DATABASE: hamgoo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -phamgoo-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Check publisher account prerequisite
        id: listing
        env:
          STRICT_WORDPRESS: ${{ inputs.wordpress_org && 'true' || 'false' }}
        run: |
          if grep -Eq '^Contributors:[[:space:]]*$' readme.txt; then
            if test "$STRICT_WORDPRESS" = true; then
              echo "::error::Set the real WordPress.org publisher username in readme.txt before WordPress publication."
              exit 1
            fi
            echo "::warning::WordPress.org publisher account is pending; exempting only readme_invalid_contributors."
            echo "ignore_code=readme_invalid_contributors" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: wp-cli:2.12.0
      - name: Build exact distribution and prepare disposable WordPress
        run: |
          python3 scripts/package.py
          WP_PATH="$RUNNER_TEMP/hamgoo-wordpress"
          echo "WP_PATH=$WP_PATH" >> "$GITHUB_ENV"
          wp core download --path="$WP_PATH"
          wp config create --path="$WP_PATH" --dbname=hamgoo_ci --dbuser=root \
            --dbpass=hamgoo-ci-only --dbhost=127.0.0.1:3306
          wp core install --path="$WP_PATH" --url=http://localhost --title=Hamgoo-CI \
            --admin_user=hamgoo_ci --admin_password=temporary-ci-only \
            --admin_email=ci@example.org --skip-email
          # Fetch outside WordPress's HTTP URL validator, then install the official local ZIP.
          curl --fail --location --retry 3 https://downloads.wordpress.org/plugin/plugin-check.latest-stable.zip \
            --output "$RUNNER_TEMP/plugin-check.zip"
          wp plugin install "$RUNNER_TEMP/plugin-check.zip" --activate --path="$WP_PATH"
          wp plugin install dist/hamgoo-live-chat-*.zip --activate --path="$WP_PATH"
      - name: Official Plugin Check on the installable package
        env:
          IGNORE_CODE: ${{ steps.listing.outputs.ignore_code }}
        run: |
          CHECK_ARGS=(--format=json --require="$WP_PATH/wp-content/plugins/plugin-check/cli.php")
          if test -n "$IGNORE_CODE"; then
            CHECK_ARGS+=("--ignore-codes=$IGNORE_CODE")
          fi
          wp plugin check hamgoo-live-chat --path="$WP_PATH" "${CHECK_ARGS[@]}" \
            | tee "$RUNNER_TEMP/plugin-check-results.txt"
          python3 scripts/plugin-check-report.py "$RUNNER_TEMP/plugin-check-results.txt"
      - name: Keep Plugin Check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-check-results
          path: ${{ runner.temp }}/plugin-check-results.txt
          if-no-files-found: ignore
